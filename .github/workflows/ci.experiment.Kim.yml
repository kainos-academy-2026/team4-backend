name: Kim-CI-Experiment

on:
  push:
    branches: [ci-pipeline-iteration]
  pull_request:

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm test

  build:
    name: Build Docker image
    runs-on: ubuntu-latest
    needs: [lint, test]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Ensure placeholder CA cert exists
        run: mkdir -p certs && touch certs/corporate-ca.crt

      - name: Build image with Git SHA tag
        run: docker build -f Dockerfile -t team4-backend:${{ github.sha }} .