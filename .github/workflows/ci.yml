name: CI

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build

  # lint + test share a single checkout/setup-node/npm ci, trading a bit of
  # parallelism for fewer duplicated installs and runner-minutes.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test
      
  container-build:
    runs-on: ubuntu-latest
    needs: [build, quality]
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker container with SHA tag
        run: |
          IMAGE_NAME=team4-backend
          IMAGE_TAG=${{ github.sha }}
          docker build -t $IMAGE_NAME:$IMAGE_TAG -t $IMAGE_NAME:latest-ci .

  publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [container-build]
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Login to ACR
        run: az acr login --name ${{ secrets.ACR_NAME }}

      - name: Build image for ACR
        run: |
          ACR_LOGIN_SERVER=${{ secrets.ACR_NAME }}.azurecr.io
          IMAGE_NAME=team4-backend
          IMAGE_SHA_TAG=${{ github.sha }}
          docker build -t $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_SHA_TAG -t $ACR_LOGIN_SERVER/$IMAGE_NAME:main .
        
      - name: Push image to ACR
        run: |
          ACR_LOGIN_SERVER=${{ secrets.ACR_NAME }}.azurecr.io
          IMAGE_NAME=team4-backend
          IMAGE_SHA_TAG=${{ github.sha }}
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:$IMAGE_SHA_TAG
          docker push $ACR_LOGIN_SERVER/$IMAGE_NAME:main
        
      - name: Verify image tags in ACR
        run: |
          az acr repository show-tags \
            --name ${{ secrets.ACR_NAME }} \
            --repository team4-backend \
            --orderby time_desc \
            --top 20 \
            --output table

  terraform-plan:
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && github.ref != 'refs/heads/main')
    runs-on: ubuntu-latest
    needs: [container-build]
    defaults:
      run:
        working-directory: ./infrastructure
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        run: terraform init -input=false -reconfigure -backend-config=environments/dev.backend.hcl

      - name: Terraform Fmt Check
        run: terraform fmt -check

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false -no-color -var-file=dev.tfvars -out=tfplan

  terraform-apply:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [publish]
    defaults:
      run:
        working-directory: ./infrastructure
    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login (Service Principal)
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "${{ secrets.AZURE_CLIENT_ID }}",
              "clientSecret": "${{ secrets.AZURE_CLIENT_SECRET }}",
              "subscriptionId": "${{ secrets.AZURE_SUBSCRIPTION_ID }}",
              "tenantId": "${{ secrets.AZURE_TENANT_ID }}"
            }

      - name: Terraform Init
        run: terraform init -input=false -reconfigure -backend-config=environments/dev.backend.hcl

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan (Main)
        run: terraform plan -input=false -no-color -var-file=dev.tfvars -out=tfplan

      - name: Terraform Apply
        run: terraform apply -input=false -no-color tfplan
        