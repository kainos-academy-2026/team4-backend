name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, lint, test]
    # Fail the job (not silently hang) if the image can't be built,
    # and don't let a stuck build block the pipeline forever.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      # The Dockerfile expects certs/corporate-ca.crt for local corporate-network
      # builds. That file is gitignored and machine-specific, so it won't exist
      # in a clean CI checkout. GitHub-hosted runners aren't behind that proxy,
      # so an empty placeholder satisfies the COPY step without affecting the build.
      - name: Ensure placeholder CA cert exists
        run: mkdir -p certs && touch certs/corporate-ca.crt

      - uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            team4-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image was built
        run: docker images team4-backend