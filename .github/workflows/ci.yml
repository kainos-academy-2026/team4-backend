name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run build

  # lint + test share a single checkout/setup-node/npm ci, trading a bit of
  # parallelism for fewer duplicated installs and runner-minutes.
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: "package-lock.json"
      - run: npm ci
      - run: npm run lint:ci
      - run: npm test

  docker-build:
    runs-on: ubuntu-latest
    needs: [build, quality]
    # Fail the job (not silently hang) if the image can't be built,
    # and don't let a stuck build block the pipeline forever.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Record build start time
        id: docker-build
        run: |
          start=$(date +%s)
          echo "start=$start" >> "$GITHUB_OUTPUT"

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: |
            team4-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Report build duration
        run: |
          start="${{ steps.docker-build.outputs.start }}"
          end=$(date +%s)
          duration=$((end - start))
          echo "### Docker build duration: ${duration}s" >> "$GITHUB_STEP_SUMMARY"

      - name: Verify image was built
        run: docker images team4-backend