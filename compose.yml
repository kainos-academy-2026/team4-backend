services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: academy-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: postgresql://academy_user:academy_password@postgres:5432/job_roles_db
      NODE_ENV: production
      JWT_ACCESS_SECRET: this-is-a-very-long-secret-key-for-jwt-access-token-testing-that-exceeds-128-characters-requirement-absolutely-definitely-surely-long-enough-now-xyz-123
      JWT_REFRESH_SECRET: this-is-a-very-long-secret-key-for-jwt-refresh-token-testing-that-exceeds-128-characters-requirement-absolutely-definitely-surely-long-enough-now-abc-456
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:16
    container_name: academy-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: job_roles_db
      POSTGRES_USER: academy_user
      POSTGRES_PASSWORD: academy_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U academy_user -d job_roles_db"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  postgres_data: